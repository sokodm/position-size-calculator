name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow runs tests and never writes to the repo. Stated
# explicitly so a fork's default token cannot do more than it needs.
permissions:
  contents: read

jobs:
  test:
    # All three are launcher targets, so all three get tested. 3.10 is the
    # floor the README promises; 3.12 is what a fresh install gets today.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile every source file
        run: python -m compileall -q app.py run.py tests

      - name: State, validation and sizing maths
        run: python tests/test_state.py

      - name: The stopped-app dialog names the right file per platform
        # Runner images all ship node, which this needs: the dialog is
        # JavaScript inside a Python string, so it is run rather than parsed.
        run: python tests/test_stopped_dialog.py

  launcher:
    # The job above cannot test the launchers: setup-python hands it the very
    # thing the launchers exist to provide. This one runs each launcher for
    # real, on both the machine-has-Python and the machine-has-none paths.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Give the machine a Python the launchers actually accept
        # The runner images ship Python 3.14, which the launchers deliberately
        # refuse -- tradingview-mcp-server caps at <3.14. Without this the
        # "machine already has Python" steps below would silently become
        # download-path tests and their "no .runtime" assertion would fail.
        # Pinning 3.12 also makes those steps prove something extra: that a
        # too-new "py -3" is skipped in favour of a supported "python".
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stand in for run.py
        # A launcher's whole contract is "hand a working Python 3.10+ to
        # run.py". The real run.py starts a server and never returns, so it is
        # replaced by a stub that reports the interpreter it was handed.
        shell: bash
        run: |
          cat > run.py <<'PY'
          import sys
          print("RUNPY_INTERPRETER=" + sys.executable)
          print("RUNPY_VERSION=%d.%d.%d" % sys.version_info[:3])
          PY

      - name: Windows -- uses the Python already on the machine
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "Start Calculator (Windows).bat" < nul > out.txt 2>&1
          type out.txt
          findstr /C:"RUNPY_VERSION=3." out.txt > nul || exit /b 1
          if exist .runtime exit /b 1

      - name: Windows -- downloads its own Python when the machine has none
        # A runner always has Python, and it cannot be hidden with a PATH shim:
        # cmd resolves "py" to a shim .bat and, invoked without CALL, a batch
        # file transfers control instead of returning -- the launcher would die
        # at the probe rather than fall through. So only the two "where" probes
        # are rewritten to a name that cannot resolve; every line the test is
        # actually about -- download, checksum, unpack, exec -- runs verbatim.
        shell: cmd
        if: runner.os == 'Windows'
        run: |
          powershell -NoProfile -Command "(Get-Content 'Start Calculator (Windows).bat') -replace 'where py ', 'where zzz_absent ' -replace 'where python ', 'where zzz_absent ' | Set-Content 'nopython.bat'"
          findstr /C:"where zzz_absent" nopython.bat > nul || exit /b 1
          call nopython.bat < nul > out2.txt 2>&1
          type out2.txt
          findstr /C:"RUNPY_VERSION=3.12.14" out2.txt > nul || exit /b 1
          findstr /C:".runtime" out2.txt > nul || exit /b 1
          if exist .runtime\.download exit /b 1

      - name: Pinned Python hashes still match the published release
        # macos-latest is Apple Silicon and GitHub has retired its Intel macOS
        # images, so the x86_64 Mac path has no runner to execute it on. Verify
        # the asset instead of the machine: every SHA-256 a launcher pins must
        # equal the one the release publishes. That catches a wrong, withdrawn
        # or re-cut tarball on all three targets, and needs no Intel hardware.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mac="Start Calculator (Mac).command"
          win="Start Calculator (Windows).bat"
          lin="Start Calculator (Linux).sh"
          ver=$(sed -n 's/^PY_VERSION="\(.*\)"$/\1/p' "$mac")
          build=$(sed -n 's/^PY_BUILD="\(.*\)"$/\1/p' "$mac")
          echo "launchers pin CPython $ver from release $build"
          rc=0
          # The drift guard that stands in for a shared provisioning library:
          # three standalone launchers may duplicate the download logic, but
          # they may not disagree about what they are downloading.
          for f in "$win" "$lin"; do
            grep -qF "$ver" "$f" || { echo "FAIL  $f does not pin CPython $ver"; rc=1; }
            grep -qF "$build" "$f" || { echo "FAIL  $f does not pin release $build"; rc=1; }
          done
          curl -fsSL -o SHA256SUMS \
            "https://github.com/astral-sh/python-build-standalone/releases/download/$build/SHA256SUMS"
          # Linux pins install_only_stripped -- the same interpreter without
          # debug symbols, which takes its download from 106 MB to 33 MB -- so
          # the variant travels with the triple rather than being assumed.
          for spec in "aarch64-apple-darwin:$mac:install_only" \
                      "x86_64-apple-darwin:$mac:install_only" \
                      "x86_64-pc-windows-msvc:$win:install_only" \
                      "x86_64-unknown-linux-gnu:$lin:install_only_stripped" \
                      "aarch64-unknown-linux-gnu:$lin:install_only_stripped"; do
            triple=$(echo "$spec" | cut -d: -f1)
            file=$(echo "$spec" | cut -d: -f2)
            variant=$(echo "$spec" | cut -d: -f3)
            asset="cpython-$ver+$build-$triple-$variant.tar.gz"
            # Exact field match: a substring grep also matches every other
            # Python version's line for the same triple.
            published=$(awk -v a="$asset" '$2 == a { print $1 }' SHA256SUMS)
            if [ -z "$published" ]; then
              echo "FAIL  the release has no $asset"
              rc=1
            elif grep -qF "$published" "$file"; then
              echo "ok    $triple ($variant)"
            else
              echo "FAIL  $triple: $file does not pin $published"
              rc=1
            fi
          done
          exit $rc

      - name: macOS -- uses the Python already on the machine
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./"Start Calculator (Mac).command" < /dev/null | tee out.txt
          grep -q "RUNPY_VERSION=3." out.txt
          test ! -e .runtime

      - name: macOS -- downloads its own Python when the machine has none
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p shim
          printf '#!/bin/sh\nexit 1\n' > shim/python3
          chmod +x shim/python3
          PATH="$PWD/shim:$PATH" ./"Start Calculator (Mac).command" < /dev/null | tee out2.txt
          grep -q "RUNPY_VERSION=3.12.14" out2.txt
          grep -q ".runtime" out2.txt
          test ! -e .runtime/.download

      - name: Linux -- uses the Python already on the machine
        if: runner.os == 'Linux'
        shell: bash
        env:
          # stdin is redirected and stdout is piped, so neither is a tty, and a
          # runner has no DISPLAY. Without this the launcher would take the
          # no-terminal branch and this step would test the refusal path.
          PSC_NO_REEXEC: "1"
        run: |
          ./"Start Calculator (Linux).sh" < /dev/null | tee out.txt
          grep -q "RUNPY_VERSION=3." out.txt
          test ! -e .runtime

      - name: Linux -- downloads its own Python when the machine has none
        if: runner.os == 'Linux'
        shell: bash
        env:
          PSC_NO_REEXEC: "1"
        run: |
          mkdir -p shim
          printf '#!/bin/sh\nexit 1\n' > shim/python3
          chmod +x shim/python3
          PATH="$PWD/shim:$PATH" ./"Start Calculator (Linux).sh" < /dev/null | tee out2.txt
          grep -q "RUNPY_VERSION=3.12.14" out2.txt
          grep -q ".runtime" out2.txt
          test ! -e .runtime/.download

      - name: Linux -- refuses to run with no terminal and no display
        # The one step that deliberately leaves PSC_NO_REEXEC unset. With both
        # streams redirected and no display, the launcher must print the command
        # to run and fail, rather than fail silently.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY -u PSC_NO_REEXEC \
            ./"Start Calculator (Linux).sh" < /dev/null > notty.txt 2>&1
          rc=$?
          set -e
          cat notty.txt
          test "$rc" -ne 0
          grep -q "Please open a terminal in this folder and run:" notty.txt

  launcher-linux-novenv:
    # The only job that can prove the venv fallthrough fires. debian:12-slim
    # with python3-minimal is the shape of a real Debian box: python3 exists and
    # passes the version check, but python3-venv is absent, so `python3 -m venv`
    # fails. The launcher must reject that interpreter and download its own --
    # if it accepted it, run.py would die building .venv.
    runs-on: ubuntu-latest
    container: debian:12-slim
    timeout-minutes: 15

    steps:
      - name: Install just enough to be the interesting case
        shell: bash
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3-minimal ca-certificates curl tar git
          python3 --version
          # Assert the trap is set. If a future image ships a working ensurepip
          # this job would quietly become a second system-Python test, and the
          # fallthrough would stop being covered anywhere.
          if python3 -m venv /tmp/probe >/dev/null 2>&1; then
            echo "python3 -m venv works here -- this job no longer tests what it claims"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Stand in for run.py
        shell: bash
        run: |
          cat > run.py <<'PY'
          import sys
          print("RUNPY_INTERPRETER=" + sys.executable)
          print("RUNPY_VERSION=%d.%d.%d" % sys.version_info[:3])
          PY

      - name: Rejects the system Python and downloads its own
        env:
          PSC_NO_REEXEC: "1"
        shell: bash
        run: |
          set -eu
          ./"Start Calculator (Linux).sh" < /dev/null | tee out.txt
          grep -q "RUNPY_VERSION=3.12.14" out.txt
          test -x .runtime/python/bin/python3
          test ! -e .runtime/.download

  diagnostics:
    # The reported failure -- a console window that closes on its own -- has
    # never reproduced here, so this job cannot test the bug. What it can test
    # is the instrumentation that has to survive it: the diagnostics run
    # end-to-end against the REAL run.py rather than the stub above, which is
    # the only job that proves the app genuinely starts on Windows.
    #
    # Deliberately no setup-python here: the image is left exactly as it comes,
    # which happens to be the interesting case. It offers "py -3" as 3.14 and
    # "python" as 3.12, so the launcher has to reject the first and fall
    # through to the second -- the discriminator this job exists to check, and
    # the arrangement that exposed the missing version ceiling to begin with.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Run the diagnostics exactly as a double-click would
        shell: cmd
        run: |
          call "Diagnose (Windows).bat" < nul > diag.txt 2>&1
          type diag.txt

      - name: Every step was logged
        shell: pwsh
        run: |
          if (-not (Test-Path logs/launcher-steps.log)) {
            throw "the launcher wrote no step log"
          }
          $steps = Get-Content -Raw logs/launcher-steps.log
          $steps
          # Asserting the file exists is what let a broken log ship once: most
          # messages read "<step> -> exit <code>", and cmd parsed that ">" as a
          # real redirect, so they went to a file named "exit" and the log kept
          # only the handful without one. Assert on a message that carries a
          # ">", and on the absence of the file a mis-parse would leave behind.
          if ($steps -notmatch 'run\.py -> exit') {
            throw "messages containing '->' never reached the log"
          }
          if (Test-Path exit) {
            throw "a stray 'exit' file was created -- '>' is being parsed as redirection"
          }

      - name: The report exists and records a successful start
        shell: pwsh
        run: |
          $report = Get-ChildItem logs/diagnostics-*.html -ErrorAction SilentlyContinue |
                      Select-Object -Last 1
          if (-not $report) { throw "no HTML report was produced" }
          "report: $($report.Name), $($report.Length) bytes"
          $html = Get-Content -Raw $report.FullName
          # A report that renders but reports nothing is the failure mode worth
          # guarding: assert on the verdict, not on the file existing.
          if ($html -notmatch 'The app started successfully') {
            $html
            throw "the diagnostics did not reach a successful start"
          }

      - name: Keep the report even when the job fails
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-diagnostics
          path: logs/

# tests/test_lookup.py is deliberately absent from this workflow. It calls
# TradingView, so a red build would as often mean "the API was slow" as "the
# code broke" -- and a suite that cries wolf gets ignored. Run it locally when
# touching the search or refresh paths.
